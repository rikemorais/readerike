services:
  readerike:
    build:
      context: .
      target: runtime
    image: readerike:latest
    profiles: [cli]  # only starts when explicitly requested
    volumes:
      - type: bind
        source: ${VIDEOS_DIR:-./videos}
        target: /videos
        read_only: true
      - whisper-models:/models
      - type: bind
        source: ${OUTPUT_DIR:-./output}
        target: /output
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OUTPUT_DIR: /output
    command: ["--help"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - uploads:/uploads
      - output:/output
      - whisper-models:/models
      - ./data:/data
    environment:
      READERIKE_UPLOAD_DIR: /uploads
      READERIKE_OUTPUT_DIR: /output
      READERIKE_DB_PATH: /data/readerike.db
      READERIKE_WHISPER_MODEL: ${WHISPER_MODEL:-base}
      READERIKE_CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  whisper-models:
    driver: local
  uploads:
    driver: local
  output:
    driver: local
